# Local development: just Postgres. Run the app with `make run`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ridewatch
      POSTGRES_PASSWORD: ridewatch
      POSTGRES_DB: ridewatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridewatch"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
