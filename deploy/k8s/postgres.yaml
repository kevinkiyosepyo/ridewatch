# Postgres 16 as a single-replica StatefulSet with a local-path PVC.
# The password comes from the ridewatch-secrets Secret (see secrets.example.yaml).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ridewatch
  labels:
    app: postgres
spec:
  clusterIP: None # headless: stable DNS name "postgres" for the single pod
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ridewatch
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ridewatch
            - name: POSTGRES_USER
              value: ridewatch
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ridewatch-secrets
                  key: POSTGRES_PASSWORD
            # Subdirectory keeps initdb happy on volumes with lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ridewatch", "-d", "ridewatch"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ridewatch", "-d", "ridewatch"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
