# Template for the one Secret everything reads. Copy, fill in real values,
# and apply it by hand — never commit the filled-in copy:
#
#   cp secrets.example.yaml secrets.yaml   # secrets.yaml is gitignored
#   $EDITOR secrets.yaml
#   kubectl apply -f secrets.yaml
#
# Generate the VAPID pair with `ridewatch vapid-keys` (or
# `docker run --rm ghcr.io/kevinkiyosepyo/ridewatch:latest vapid-keys`).
apiVersion: v1
kind: Secret
metadata:
  name: ridewatch-secrets
  namespace: ridewatch
type: Opaque
stringData:
  # Password for the in-cluster Postgres (postgres.yaml) — pick one.
  POSTGRES_PASSWORD: change-me
  # Must embed the same password. "postgres" is the StatefulSet's service name.
  DATABASE_URL: postgres://ridewatch:change-me@postgres:5432/ridewatch?sslmode=disable
  # Grafana admin login (user "admin").
  GRAFANA_ADMIN_PASSWORD: change-me
  # Web Push credentials; leave both empty to run with push disabled.
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
