name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ridewatch
          POSTGRES_PASSWORD: ridewatch
          POSTGRES_DB: ridewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ridewatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: go test (with database)
        env:
          TEST_DATABASE_URL: postgres://ridewatch:ridewatch@localhost:5432/ridewatch?sslmode=disable
        run: go test ./...
